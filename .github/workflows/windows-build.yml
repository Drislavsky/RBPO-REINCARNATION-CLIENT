name: Windows Build

on:
  push:
    branches: [ main, PRAC_5, PRAC_6 ]
  pull_request:
    branches: [ main, PRAC_5, PRAC_6 ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build installer
        run: cmake --build build --config Release --target BMTXInstaller

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMTX-windows-x64
          path: |
            build/Release/BMTX.exe
            build/Release/BMTXService.exe
            build/Release/avdb/bmtx_avdb.bin
            build/Release/avdb/bmtx_avdb.bak
            assets/bmtx.ico
            assets/bmtx_icon_preview.png

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMTXSetup
          path: build/installer/BMTXSetup.exe

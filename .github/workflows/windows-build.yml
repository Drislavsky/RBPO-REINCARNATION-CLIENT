name: Windows CMake Build and Installer

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build installer
        run: cmake --build build --config Release --target BMTXInstaller

      - name: Upload application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BMTX-windows-x64
          path: |
            build/Release/BMTX.exe
            build/Release/BMTXService.exe
            build/Release/avdb/bmtx_avdb.bin
            build/Release/avdb/bmtx_avdb.bak
            assets/bmtx.ico
            assets/bmtx_icon_preview.png
            README_AVDB_TASK.txt
            README_INSTALLER_TASK.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMTX-windows-x64-installer
          path: build/installer/BMTXSetup.exe
